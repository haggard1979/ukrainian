# Test every push and pull request; publish the site to GitHub Pages from main only when all tests pass.
# Pages source must be set to "GitHub Actions" (Settings → Pages → Build and deployment → Source).
# Kept fast: the site artifact is built while the tests run, so after green tests only the deployment is left.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (data check + browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the tests load Playwright from the global npm root (tests/lib.js); headless runs only need the
      # small headless shell (download ≈ 15 s, faster than restoring a cache)
      - name: Install Playwright and headless Chromium
        run: |
          npm install -g --no-audit --no-fund playwright@1.56.1
          playwright install --with-deps --only-shell chromium
      - name: Run tests
        run: node tests/run.js --jobs 6

  build:
    name: Collect site files
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # only the website: no tests, tools, project notes or skills
      - run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.claude' --exclude 'tests' --exclude 'tools' \
            --exclude 'CLAUDE.md' --exclude '_site' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
