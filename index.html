<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ukrainisch lernen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600&family=Onest:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f4ef; --surface:#ffffff; --ink:#172030; --muted:#5b6474; --line:#d7dbe1;
  --blue:#2f5f9e; --blue-soft:#e8eef7; --on-blue:#ffffff; --gold:#ddb03a;
  --font-uk:"Fira Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-ui:"Onest","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#10151c; --surface:#18202a; --ink:#e6eaf0; --muted:#9aa4b2; --line:#2b3542; --blue:#86aee6; --blue-soft:#1a283b; --on-blue:#0f1724; --gold:#dcb850; color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#10151c; --surface:#18202a; --ink:#e6eaf0; --muted:#9aa4b2; --line:#2b3542; --blue:#86aee6; --blue-soft:#1a283b; --on-blue:#0f1724; --gold:#dcb850; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:1.0625rem;line-height:1.5}
body::before{content:"";display:block;height:8px;background:linear-gradient(var(--blue) 0 50%,var(--gold) 50% 100%)}
main{max-width:44rem;margin:0 auto;padding:20px 16px 56px}
.hero{display:flex;align-items:center;justify-content:center;gap:clamp(20px,6vw,40px);padding:22px 16px;margin:0 0 26px;background:var(--blue-soft);border-top:3px solid var(--gold);border-radius:8px}
.hero svg{display:block;flex:none}
.hero .coa{filter:drop-shadow(0 1px 2px rgba(0,0,0,.18))}
.stitch{display:block;width:100%;height:14px;margin-bottom:22px}
.stitch-end{margin:36px 0 0}
.sa{fill:var(--gold)} .sb{fill:var(--blue)}
h1{font-size:1.75rem;margin:0 0 4px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head-tools{display:flex;gap:8px;flex-shrink:0;align-items:flex-start}
.theme-btn{display:flex;align-items:center;justify-content:center;min-width:44px;min-height:34px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--blue);cursor:pointer}
.theme-btn:hover{border-color:var(--blue)}
.lang{display:flex;flex-shrink:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.lang button{display:flex;align-items:center;color:inherit;background:none;border:0;padding:5px 10px;min-height:34px;cursor:pointer}
.flag{display:block;border-radius:2px;box-shadow:0 0 0 1px var(--line)}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.lang button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
p{margin:0 0 28px;color:var(--muted)}
h2::before{content:"";display:inline-block;width:.55em;height:.55em;margin-right:.6em;vertical-align:.05em;background:var(--gold);transform:rotate(45deg)}
h2{font-size:.8125rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
a{display:block;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:6px;color:inherit;text-decoration:none}
a:hover{border-color:var(--blue);border-left-color:var(--gold);background:var(--blue-soft)}
a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a .title{color:var(--blue)}
.title{font-weight:600}
.uk{font-family:var(--font-uk);color:var(--muted);font-size:.9375rem}
</style>
<script>try{var th=localStorage.getItem('ukrainian.theme');if(th==='light'||th==='dark')document.documentElement.dataset.theme=th;}catch(e){}</script>
</head>
<body>
<main>
  <svg class="stitch" aria-hidden="true" width="100%" height="14"><defs><pattern id="stitch-tile" width="16" height="7" patternUnits="userSpaceOnUse" patternTransform="scale(2)"></pattern></defs><rect width="100%" height="14" fill="url(#stitch-tile)"></rect></svg>
  <!-- Lesser coat of arms of Ukraine (public domain), SVG from the npm package coat-of-arms (MIT) -->
  <div class="hero">
    <svg class="coa" xmlns="http://www.w3.org/2000/svg" width="75" height="104" aria-hidden="true" viewBox="-82.5 0 165 230.5" fill="#ffd500"><path d="M-81.25 1.25h162.5v172.5a31.25 31.25 0 0 1-18.578029 28.565428L0 228.867475l-62.671971-27.802047A31.25 31.25 0 0 1-81.25 172.5z" fill="#005bbb" stroke="#ffd500" stroke-width="2.5"/><path d="M5.985561 78.82382a104.079383 104.079383 0 0 0 14.053598 56.017033 55 55 0 0 1-13.218774 70.637179A20 20 0 0 0 0 212.5a20 20 0 0 0-6.820384-7.021968 55 55 0 0 1-13.218774-70.637179A104.079383 104.079383 0 0 0-5.98556 78.82382l-1.599642-45.260519A30.103986 30.103986 0 0 1 0 12.5a30.103986 30.103986 0 0 1 7.585202 21.063301zM5 193.624749a45 45 0 0 0 6.395675-53.75496A114.079383 114.079383 0 0 1 0 112.734179a114.079383 114.079383 0 0 1-11.395675 27.13561A45 45 0 0 0-5 193.624749V162.5H5z"/><path id="coa-half" d="M27.779818 75.17546A62.64982 62.64982 0 0 1 60 27.5v145H0l-5-10a22.5 22.5 0 0 1 17.560976-21.95122l14.634147-3.292683a10 10 0 1 0-4.427443-19.503751zm5.998315 34.353887a20 20 0 0 1-4.387889 37.482848l-14.634146 3.292683A12.5 12.5 0 0 0 5 162.5h45V48.265462a52.64982 52.64982 0 0 0-12.283879 28.037802zM42 122.5h10v10H42z"/><use href="#coa-half" transform="scale(-1 1)"/></svg>
    <svg class="wave" viewBox="0 0 140 100" width="150" height="107" aria-hidden="true"><defs><linearGradient id="flag-shade" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".32" stop-color="#fff" stop-opacity="0"/><stop offset=".62" stop-color="#000" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient></defs><rect x="1" y="2" width="4" height="96" rx="2" style="fill:var(--muted)"/><path d="M6 10C49 2 92 18 136 10V50C92 58 49 42 6 50Z" fill="#005bbb"/><path d="M6 50C49 42 92 58 136 50V90C92 98 49 82 6 90Z" fill="#ffd500"/><path d="M6 10C49 2 92 18 136 10V90C92 98 49 82 6 90Z" fill="url(#flag-shade)"/></svg>
  </div>
  <div class="head">
    <h1 data-i18n="h1">Ukrainisch lernen</h1>
    <div class="head-tools"><button type="button" class="theme-btn" id="theme-toggle"></button><div class="lang" role="group" aria-label="Sprache / Language">
      <button type="button" data-set-lang="de" lang="de" title="Deutsch" aria-label="Deutsch"><svg class="flag" viewBox="0 0 30 20" width="24" height="16" aria-hidden="true"><rect width="30" height="20" fill="#c8102e"/><rect y="6.67" width="30" height="6.67" fill="#fff"/></svg></button>
      <button type="button" data-set-lang="en" lang="en" title="English" aria-label="English"><svg class="flag" viewBox="0 0 60 30" width="24" height="16" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><clipPath id="gb-clip"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath><rect width="60" height="30" fill="#012169"/><path d="M0,0L60,30M60,0L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0L60,30M60,0L0,30" clip-path="url(#gb-clip)" stroke="#c8102e" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#c8102e" stroke-width="6"/></svg></button>
    </div></div>
  </div>
  <p data-i18n="intro">Übungen zur ukrainischen Grammatik.</p>
  <h2 data-i18n="grammar">Grammatik</h2>
  <ul>
    <li><a href="grammar/locative/locative-trainer.html">
      <span class="title" data-i18n="locative">Lokativ-Trainer</span><br>
      <span class="uk" lang="uk">Місцевий відмінок</span>
    </a></li>
    <li><a href="grammar/numbers/numbers-trainer.html">
      <span class="title" data-i18n="numbers">Zahlen-Trainer</span><br>
      <span class="uk" lang="uk">Числівники</span>
    </a></li>
    <li><a href="grammar/present/present-trainer.html">
      <span class="title" data-i18n="present">Gegenwart-Trainer</span><br>
      <span class="uk" lang="uk">Теперішній час</span>
    </a></li>
    <li><a href="grammar/past/past-trainer.html">
      <span class="title" data-i18n="past">Vergangenheit-Trainer</span><br>
      <span class="uk" lang="uk">Минулий час</span>
    </a></li>
  </ul>
  <svg class="stitch stitch-end" aria-hidden="true" width="100%" height="14"><rect width="100%" height="14" fill="url(#stitch-tile)"></rect></svg>
</main>
<script>
(function(){
  /* cross-stitch band, same motif as on the trainers */
  var h='';
  for(var y=0;y<7;y++)for(var x=0;x<16;x++){
    var d1=Math.abs(x-4)+Math.abs(y-3),ax=Math.abs(x-12),ay=Math.abs(y-3),c='';
    if(d1===3)c='sa';else if(d1<=1)c='sb';
    else if(ax===ay&&ay<=2)c=ay===0?'sa':'sb';
    if(c)h+='<rect class="'+c+'" x="'+x+'" y="'+y+'" width="1" height="1"/>';
  }
  document.getElementById('stitch-tile').innerHTML=h;
  var T={
    de:{title:'Ukrainisch lernen',h1:'Ukrainisch lernen',intro:'Übungen zur ukrainischen Grammatik.',grammar:'Grammatik',locative:'Lokativ-Trainer',numbers:'Zahlen-Trainer',present:'Gegenwart-Trainer',past:'Vergangenheit-Trainer'},
    en:{title:'Learn Ukrainian',h1:'Learn Ukrainian',intro:'Exercises on Ukrainian grammar.',grammar:'Grammar',locative:'Locative trainer',numbers:'Numbers trainer',present:'Present tense trainer',past:'Past tense trainer'}
  };
  var KEY='ukrainian.lang',lang='de';
  try{var s=localStorage.getItem(KEY);if(s==='de'||s==='en')lang=s;else if(!/^de\b/i.test(navigator.language||'de'))lang='en';}catch(e){}
  var btns=document.querySelectorAll('[data-set-lang]');
  function apply(){
    document.documentElement.lang=lang;document.title=T[lang].title;
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'),function(e){e.textContent=T[lang][e.dataset.i18n];});
    Array.prototype.forEach.call(btns,function(b){b.setAttribute('aria-pressed',String(b.dataset.setLang===lang));});
    renderTheme();
  }
  Array.prototype.forEach.call(btns,function(b){
    b.addEventListener('click',function(){lang=b.dataset.setLang;try{localStorage.setItem(KEY,lang);}catch(e){}apply();});
  });
  /* ---------- light / dark (system default unless chosen; stored for all pages) ---------- */
  var THEME_KEY='ukrainian.theme',THEME_T={de:{dark:'Dunkles Design',light:'Helles Design'},en:{dark:'Dark mode',light:'Light mode'}};
  var MOON='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>';
  var SUN='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  var darkMq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  function isDark(){var th=document.documentElement.dataset.theme;return th?th==='dark':!!(darkMq&&darkMq.matches);}
  function renderTheme(){
    var b=document.getElementById('theme-toggle'),d=isDark(),label=THEME_T[lang][d?'light':'dark'];
    b.innerHTML=d?SUN:MOON;b.title=label;b.setAttribute('aria-label',label);
  }
  document.getElementById('theme-toggle').addEventListener('click',function(){
    var th=isDark()?'light':'dark';
    document.documentElement.dataset.theme=th;
    try{localStorage.setItem(THEME_KEY,th);}catch(e){}
    renderTheme();
  });
  if(darkMq&&darkMq.addEventListener)darkMq.addEventListener('change',renderTheme);
  apply();
})();
</script>
</body>
</html>
