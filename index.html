<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ukrainisch lernen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Onest:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f5f2; --surface:#ffffff; --ink:#1b181a; --muted:#6a6367; --line:#d9d5d3; --red:#b1132c;
  --font-uk:"Literata",Georgia,"Times New Roman",serif;
  --font-ui:"Onest","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#151214; --surface:#201b1e; --ink:#eeeae6; --muted:#a69da1; --line:#3b3338; --red:#f0596d; color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:1.0625rem;line-height:1.5}
main{max-width:44rem;margin:0 auto;padding:40px 16px 56px}
h1{font-size:1.75rem;margin:0 0 4px}
p{margin:0 0 28px;color:var(--muted)}
h2{font-size:.8125rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
a{display:block;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;color:inherit;text-decoration:none}
a:hover{border-color:var(--red)}
a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.title{font-weight:600}
.uk{font-family:var(--font-uk);color:var(--muted);font-size:.9375rem}
</style>
</head>
<body>
<main>
  <h1>Ukrainisch lernen</h1>
  <p>Übungen zur ukrainischen Grammatik.</p>
  <h2>Grammatik</h2>
  <ul>
    <li><a href="grammar/locative/locative-trainer.html">
      <span class="title">Lokativ-Trainer</span><br>
      <span class="uk" lang="uk">Місцевий відмінок</span>
    </a></li>
  </ul>
</main>
</body>
</html>
